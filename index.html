<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>قیمت لحظه‌ای ارز</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #050816, #0b1733);
    font-family: Tahoma, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: white;
}

.container {
    width: 100%;
    max-width: 420px;
}

.title {
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 20px;
}

.card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 22px;
    margin-bottom: 15px;
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
}

.name {
    font-size: 17px;
    margin-bottom: 10px;
    opacity: 0.85;
}

.price {
    font-size: 30px;
    font-weight: bold;
    direction: ltr;
    text-align: right;
}

.unit {
    margin-top: 5px;
    opacity: 0.65;
    font-size: 14px;
}

#time {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    opacity: 0.6;
}

.error {
    color: #ff5555;
}
</style>
</head>

<body>

<div class="container">

    <div class="title">
        💰 قیمت لحظه‌ای ارز
    </div>

    <!-- دلار -->
    <div class="card">
        <div class="name">🇺🇸 دلار آمریکا</div>
        <div class="price" id="usd">---</div>
        <div class="unit">تومان</div>
    </div>

    <!-- درهم -->
    <div class="card">
        <div class="name">🇦🇪 درهم امارات</div>
        <div class="price" id="aed">---</div>
        <div class="unit">تومان</div>
    </div>

    <!-- ریال عمان -->
    <div class="card">
        <div class="name">🇴🇲 ریال عمان</div>
        <div class="price" id="omr">---</div>
        <div class="unit">تومان</div>
    </div>

    <div id="time">
        در حال دریافت قیمت...
    </div>

</div>

<script>

const API_KEY = "freeL8rmnJQvTBwmj6aMsQYTtU1Yg1yP";

function formatPrice(value) {
    return Number(value).toLocaleString("en-US");
}

async function loadPrices() {

    try {

        const response = await fetch(
            "https://api.navasan.tech/latest/?api_key=" + API_KEY
        );

        if (!response.ok) {
            throw new Error("API Error: " + response.status);
        }

        const data = await response.json();

        console.log("API DATA:", data);

        // دلار
        document.getElementById("usd").textContent =
            formatPrice(data.usd_sell.value);

        // درهم
        document.getElementById("aed").textContent =
            formatPrice(data.aed_sell.value);

        // ریال عمان
        document.getElementById("omr").textContent =
            formatPrice(data.omr.value);

        // زمان بروزرسانی
        document.getElementById("time").textContent =
            "آخرین بروزرسانی: " +
            new Date().toLocaleTimeString("fa-IR");

    } catch (error) {

        console.error("ERROR:", error);

        document.getElementById("time").innerHTML =
            '<span class="error">❌ خطا در دریافت قیمت</span>';
    }
}

// اجرای اولیه
loadPrices();

// بروزرسانی هر 60 ثانیه
setInterval(loadPrices, 60000);

</script>

</body>
</html>
