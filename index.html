<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قیمت لحظه‌ای ارز</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:radial-gradient(circle at top,#1e40af,#0f172a 50%),#020617;
color:#fff;
}
.card{
width:100%;
max-width:430px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.15);
border-radius:30px;
padding:25px;
box-shadow:0 20px 50px rgba(0,0,0,.4);
}
.title{text-align:center;font-size:30px;font-weight:800;margin-bottom:25px}
.currency{
background:rgba(255,255,255,.08);
border-radius:22px;
padding:18px;
margin-bottom:15px;
overflow:hidden;
transition:.3s;
}
.currency:hover{transform:translateY(-4px)}
.name{font-size:18px;opacity:.9}
.value{
font-size:38px;
font-weight:900;
margin-top:12px;
text-shadow:0 0 15px rgba(96,165,250,.4);
}
.value.animate{
animation:pop 0.45s ease;
}
@keyframes pop{
0%{opacity:0;transform:translateY(30px) scale(.8);filter:blur(5px)}
50%{transform:translateY(-6px) scale(1.1)}
100%{opacity:1;transform:translateY(0) scale(1)}
}
.unit{opacity:.7;margin-top:6px}
.time{text-align:center;margin-top:15px;opacity:.8;font-size:14px}
.btn{
width:100%;margin-top:20px;border:none;border-radius:18px;
padding:15px;font-size:17px;font-weight:700;cursor:pointer;
background:linear-gradient(135deg,#2563eb,#06b6d4);color:#fff;
}
.error{color:#ffb4b4}
.credit{text-align:center;margin-top:22px;color:rgba(255,255,255,.65);font-size:14px}
.credit span{
display:block;margin-top:6px;font-size:19px;font-weight:900;
background:linear-gradient(90deg,#60a5fa,#22d3ee,#38bdf8);
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
</style>
</head>
<body>

<div class="card">
<div class="title">💱 قیمت لحظه‌ای ارز</div>

<div class="currency">
<div class="name">💵 دلار آمریکا</div>
<div class="value" id="usd">...</div>
<div class="unit">تومان</div>
</div>

<div class="currency">
<div class="name">🇦🇪 درهم امارات</div>
<div class="value" id="aed">...</div>
<div class="unit">تومان</div>
</div>

<div class="currency">
<div class="name">🇴🇲 ریال عمان</div>
<div class="value" id="omr">...</div>
<div class="unit">تومان</div>
</div>

<div class="time" id="time">در حال دریافت اطلاعات...</div>

<button class="btn" onclick="loadPrices()">بروزرسانی</button>

<div class="credit">
ساخته شده توسط
<span>Mehdi Dastbord</span>
</div>
</div>

<script>
const API_KEY="freerSZGp1p2Is63Q1ZTzqDRqSEGdnMx";

function formatPrice(v){
 return Math.round(v).toLocaleString("en-US");
}

function animateNumber(el,endValue,duration=1000){
 const start=0;
 const startTime=performance.now();

 el.classList.remove("animate");
 void el.offsetWidth;
 el.classList.add("animate");

 function update(now){
   const progress=Math.min((now-startTime)/duration,1);
   const ease=1-Math.pow(1-progress,3);
   const value=start+(endValue-start)*ease;

   if(progress<0.25){
      const random=Math.floor(Math.random()*endValue);
      el.textContent=formatPrice(random);
   }else{
      el.textContent=formatPrice(value);
   }

   if(progress<1){
      requestAnimationFrame(update);
   }else{
      el.textContent=formatPrice(endValue);
   }
 }
 requestAnimationFrame(update);
}

async function loadPrices(){
 try{
   const response=await fetch(
     "https://api.navasan.tech/latest/?api_key="+API_KEY
   );
   const data=await response.json();

   if(data.usd_sell){
     animateNumber(
       document.getElementById("usd"),
       Number(data.usd_sell.value)
     );
   }

   if(data.aed_sell){
     animateNumber(
       document.getElementById("aed"),
       Number(data.aed_sell.value)
     );
   }

   if(data.omr){
     animateNumber(
       document.getElementById("omr"),
       Number(data.omr.value)
     );
   }

   document.getElementById("time").textContent =
   "آخرین بروزرسانی: " +
   new Date().toLocaleTimeString("fa-IR");

 }catch(e){
   document.getElementById("time").innerHTML =
   '<span class="error">خطا در دریافت اطلاعات</span>';
 }
}

loadPrices();
setInterval(loadPrices,60000);
</script>

</body>
</html>
